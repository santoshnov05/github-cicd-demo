name: Dev to Main CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =========================
  # 1. BUILD
  # =========================
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .


  # =========================
  # 2. TEST
  # =========================
  test:

    needs: build

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest


  # =========================
  # 3. DEPLOY
  # =========================
  deploy:

    needs: test

    # Deploy only when code is merged/pushed to main
    if: github.ref == 'refs/heads/main'

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "Deploying application..."
          echo "Deployment successful."